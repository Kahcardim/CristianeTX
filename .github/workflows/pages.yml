name: CristianeTX Quality & Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "qa/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "qa/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cristianetx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QA dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Structural gate
        run: npm run qa:structure

      - name: Content and identity contracts
        run: npm run qa:content

      - name: Cross-browser and regression gate
        run: npm run qa:e2e

      - name: Build validated artifact
        run: |
          rm -rf dist
          cp -R docs dist
          npx --yes esbuild@0.25.9 docs/assets/css/styles.css --minify --outfile=dist/assets/css/styles.css
          npx --yes esbuild@0.25.9 docs/assets/js/main.js --minify --outfile=dist/assets/js/main.js

      - name: Audit production artifact
        run: npm run qa:bundle

      - name: Smoke validated artifact
        env:
          SITE_DIR: dist
        run: npx playwright test tests/smoke.spec.mjs --project=chromium

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cristianetx-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cristianetx-qa-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: cristianetx-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    name: Production Smoke
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate published site
        run: node scripts/production-smoke.mjs "${{ needs.deploy.outputs.page_url }}"
